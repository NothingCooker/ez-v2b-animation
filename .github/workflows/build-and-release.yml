name: build-and-release

# 触发方式：
#   1. 推送 v* 标签  -> 打包并创建 GitHub Release
#   2. 手动触发      -> 只打包，产物存为 workflow artifact（不建 Release）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（仅手动触发时用于命名产物，如 1.0.0）"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  build:
    name: 打包插件
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 语法检查（全部模块）
        run: |
          python - <<'PY'
          import ast, os, sys
          root = "ez_v2b_animation"
          bad = []
          for fn in sorted(os.listdir(root)):
              if not fn.endswith(".py"):
                  continue
              p = os.path.join(root, fn)
              src = open(p, encoding="utf-8").read()
              try:
                  ast.parse(src)
                  print("OK   %s" % fn)
              except SyntaxError as e:
                  bad.append("%s line %s: %s" % (fn, e.lineno, e.msg))
          if bad:
              print("语法错误:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("全部模块语法通过")
          PY

      - name: 检查无 emoji
        run: python tools/strip_emoji.py --check

      - name: 检查署名
        run: |
          python - <<'PY'
          import os, sys
          AUTHOR = "B站 @高压郭炖大葱"
          root = "ez_v2b_animation"
          missing = []
          for fn in sorted(os.listdir(root)):
              if not fn.endswith(".py"):
                  continue
              src = open(os.path.join(root, fn), encoding="utf-8").read()
              if AUTHOR not in src:
                  missing.append(fn)
          if missing:
              print("缺署名的模块: %s" % missing)
              sys.exit(1)
          print("全部模块含署名: %s" % AUTHOR)
          PY

      - name: 打包插件
        run: python tools/pack_ez.py

      - name: 校验 zip 结构
        run: |
          python - <<'PY'
          import os, sys, zipfile
          zp = "ez_v2b_animation.zip"
          if not os.path.isfile(zp):
              print("未生成 %s" % zp)
              sys.exit(1)
          with zipfile.ZipFile(zp) as z:
              bad = z.testzip()
              if bad is not None:
                  print("zip 损坏: %s" % bad)
                  sys.exit(1)
              names = z.namelist()
              print("条目数 %d" % len(names))
              for n in names:
                  print("  %-46s %d 字节" % (n, z.getinfo(n).file_size))
              if any("__pycache__" in n or n.endswith(".pyc") for n in names):
                  print("zip 内混入了缓存文件")
                  sys.exit(1)
              if not all(n.startswith("ez_v2b_animation/") for n in names):
                  print("条目不在 ez_v2b_animation/ 下")
                  sys.exit(1)
          print("zip 校验通过，大小 %d 字节" % os.path.getsize(zp))
          PY

      - name: 计算 sha256
        id: hash
        run: |
          python - <<'PY'
          import hashlib, os
          h = hashlib.sha256(open("ez_v2b_animation.zip", "rb").read()).hexdigest()
          with open("SHA256SUMS.txt", "w", encoding="utf-8", newline="\n") as f:
              f.write("%s  ez_v2b_animation.zip\n" % h)
              if os.path.isfile("ez_v2b_animation_single.py"):
                  h2 = hashlib.sha256(
                      open("ez_v2b_animation_single.py", "rb").read()).hexdigest()
                  f.write("%s  ez_v2b_animation_single.py\n" % h2)
          print("sha256 = %s" % h)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("sha256=%s\n" % h)
          PY

      - name: 读取版本号
        id: ver
        run: |
          python - <<'PY'
          import os, re
          src = open("ez_v2b_animation/__init__.py", encoding="utf-8").read()
          m = re.search(r'"version"\s*:\s*\(([^)]*)\)', src)
          ver = ".".join(x.strip() for x in m.group(1).split(",") if x.strip()) if m else "0.0.0"
          print("version = %s" % ver)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("version=%s\n" % ver)
          PY

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ez-v2b-animation-${{ steps.ver.outputs.version }}
          path: |
            ez_v2b_animation.zip
            ez_v2b_animation_single.py
            SHA256SUMS.txt
          if-no-files-found: error

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ez-v2b-animation ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ez-v2b-animation ${{ github.ref_name }}

            作者：B站 @高压郭炖大葱

            **面向 VRChat 模型优化**的一键 IK 化工具。

            ### 解决的痛点

            | 痛点 | 具体表现 |
            | --- | --- |
            | 骨骼命名混乱 | VRChat 标准、VRM 0.x、VRM 1.0、MMD 日文命名混用 |
            | 没有 IK | 纯 FK 骨架，摆姿势全靠一根根转骨骼 |
            | 手柄命名不可预测 | `LowerLeg.L.003` 这种，靠猜猜不出来 |
            | IK 不完整 | 有 IK 但缺链末端旋转、缺控制器、缺分组 |
            | 形态键体系不统一 | `vrc.blink_left` / `vrc.blink` / `vrc.Blink` / `まばたき` |
            | 贴图路径失效 | FBX 导入后材质变紫 |
            | 传文件丢贴图 | 外部引用的贴图不跟着 blend 走 |

            核心是结构发现：不写死任何骨骼名，全部靠约束结构反查，换模型不用改代码。

            ### 安装

            1. 下载 `ez_v2b_animation.zip`
            2. Blender 中打开：编辑 > 偏好设置 > 附加组件 > 从磁盘安装
            3. 选择刚下载的 zip，勾选启用
            4. 3D 视图按 `N`，侧栏出现 `EZ V2B` 标签页

            环境要求：Blender 4.0 及以上。

            ### 面捕依赖（可选）

            面部捕捉需要额外的依赖包（约 94 MB），与插件分开分发。
            未安装时不影响 IK 控制与表情功能。

            安装方式：面板 > 面部捕捉 > 顶部「安装面捕依赖」，
            选择「从指定目录/zip 部署」，指定依赖包即可。

            ### 校验

            下载后可用 `SHA256SUMS.txt` 核对文件完整性。

            ### 文件说明

            | 文件 | 说明 |
            | --- | --- |
            | `ez_v2b_animation.zip` | 插件本体，从磁盘安装 |
            | `ez_v2b_animation_single.py` | 单文件版，供文本块或快速分发 |
            | `SHA256SUMS.txt` | 校验和 |

            ### 本次构建

            插件版本：`${{ steps.ver.outputs.version }}`
            zip SHA256：`${{ steps.hash.outputs.sha256 }}`
          files: |
            ez_v2b_animation.zip
            ez_v2b_animation_single.py
            SHA256SUMS.txt
