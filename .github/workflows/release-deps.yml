name: release-deps

# 面捕依赖包（约 94 MB）单独发布，不打进插件 zip。
# 依赖体积大且很少变动，与插件分开可以让插件保持约 110 KB 便于频繁更新。
#
# 触发方式：手动触发（workflow_dispatch）。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  note:
    name: 依赖包说明
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成依赖包说明
        run: python tools/make_deps_readme.py

      - name: 上传说明
        uses: actions/upload-artifact@v4
        with:
          name: deps-readme
          path: DEPS_README.md
